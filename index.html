<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversor de arquivos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<h1>Conversor de arquivos</h1>
<p class="sub">Tudo roda no seu navegador. Nada é enviado para servidor.</p>

<label class="drop" id="drop" for="file">
<input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.bmp,.gif">
<span class="drop-title" id="dropTitle">Escolha ou arraste um arquivo</span>
<span class="drop-hint">PDF, PNG, JPG, WEBP, BMP, GIF</span>
</label>

<section class="panel" id="panel" hidden>
<div class="info">
<div>
<span class="k">Arquivo</span>
<span class="v" id="fileName"></span>
</div>
<div>
<span class="k">Tipo detectado</span>
<span class="v badge" id="fileType"></span>
</div>
</div>

<label class="field" for="target">Converter para</label>
<select id="target"></select>

<div class="field-row" id="qualityRow">
<label class="field" for="quality">Qualidade <output id="qualityOut">90%</output></label>
<input type="range" id="quality" min="10" max="100" value="90">
</div>

<button id="convert" type="button">Converter</button>
<p class="status" id="status" role="status"></p>
<div class="results" id="results"></div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script src="script.js"></script>
</body>
</html>
